server:
  port: 8080

spring:
  application:
    name: gateway-mvc-extensions
  threads:
    virtual:
      enabled: true
  # Outbound proxy timeouts. These matter more with virtual threads on: the servlet thread pool
  # no longer caps concurrency, so a slow downstream would pile up requests instead of being
  # rejected by a full pool. Gateway 5.0.3 has no timeout properties of its own; Boot applies
  # these to the JDK HttpClient it proxies with.
  #
  # read-timeout is a TOTAL deadline for the exchange, not just the wait for the response to
  # start: it maps to HttpRequest.Builder#timeout, so a body still streaming at 5s is cut off
  # and the caller gets a 500. Raise it (or set it per route) before serving large downloads or
  # SSE from here. ProxyTimeoutTests pins both halves of that behaviour down.
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order
              uri: ${downstream.url:http://localhost:8081}
              predicates:
                - Path=/orders/**
              # List order is execution order. @GatewayFilterBean names, hand-written aliases and
              # the built-in shorthand notation can be mixed freely.
              filters:
                - name: authFilter
                - name: tenantFilter
                - AddRequestHeader=X-Gateway,mvc-extensions
            - id: echo
              uri: ${downstream.url:http://localhost:8081}
              predicates:
                - Path=/echo/**
              filters:
                - name: authFilter
                - name: jsonEnvelopeFilter
            # A hand-written alias instead of @GatewayFilterBean, because this filter takes a
            # per-route argument. See GatewayArgsFilterAliases.
            - id: public
              uri: ${downstream.url:http://localhost:8081}
              predicates:
                - Path=/public/**
              filters:
                - name: requireUser
                  args:
                    mode: lenient

# All default to true; see GatewayFilterProperties.
gateway:
  filter:
    validate-beans: true
    fail-on-name-collision: true

logging:
  level:
    # Covers the framework's request trace and the filters' own lines. One entry rather than one
    # per package so a future package move cannot silently turn the trace off.
    com.example.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
